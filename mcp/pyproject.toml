[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "product-graph-mcp"
version = "0.1.0"
description = "MCP server exposing ProductGraph for Odoo 19 CE to LLM agents (Claude, GPT)"
readme = "README.md"
authors = [{ name = "ProductGraph Contributors" }]
license = { text = "LGPL-3.0-or-later" }
requires-python = ">=3.11"

dependencies = [
    "mcp >= 1.2.0",
    "httpx >= 0.27.0",
    "pydantic >= 2.7.0",
    "python-dotenv >= 1.0.1",
]

[project.scripts]
product-graph-mcp = "product_graph_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/product_graph_mcp"]
